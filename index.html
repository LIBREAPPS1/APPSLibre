  <meta name="description" content="Descubrí aplicaciones open source: herramientas libres, potentes y creadas por comunidades abiertas.">
  <title>APPSLibre — Software libre para todo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10130f;
      --panel: #171b16;
      --panel-2: #1d221b;
      --line: #2c3329;
      --text: #f2f5ed;
      --muted: #a1aa99;
      --lime: #c5f467;
      --lime-dark: #a5d84b;
      --radius: 22px;
      --max: 1200px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    .container { width: min(var(--max), calc(100% - 48px)); margin-inline: auto; }
    .topbar { height: 78px; border-bottom: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.045em; font-size: 1.25rem; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: #141810; background: var(--lime); border-radius: 11px; font-size: 1.18rem; font-weight: 900; box-shadow: 0 0 26px #c5f46722; }
    .brand span em { color: var(--lime); font-style: normal; }
    .nav-links { display: flex; gap: 30px; align-items: center; color: var(--muted); font-size: .91rem; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.nav-news { display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border:1px solid #536a34; border-radius:12px; background:linear-gradient(135deg,#25331b,#1a2115); color:var(--lime); font-weight:850; box-shadow:inset 0 1px 0 #ffffff0a, 0 0 0 1px #c5f4670d; transition:transform .2s,background .2s,border-color .2s,box-shadow .2s; }
    .nav-links a.nav-news::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 10px #c5f46799; }
    .nav-links a.nav-news:hover, body.news-visible .nav-links a.nav-news { color:#151a10; background:var(--lime); border-color:var(--lime); box-shadow:0 0 22px #c5f46725; transform:translateY(-1px); }
    body.news-visible .nav-links a.nav-news::before { background:#151a10; box-shadow:none; }
    .nav-cta { background: var(--lime); color: #171b12; padding: 10px 15px; border-radius: 12px; font-weight: 750; font-size: .88rem; transition: transform .2s, background .2s; }
    .nav-cta:hover { background: #d5ff8c; transform: translateY(-1px); }
    .hero { padding: 86px 0 54px; position: relative; overflow: hidden; }
    .hero::before { content: ""; position: absolute; width: 520px; height: 360px; border-radius: 50%; background: #b5ef4c0d; filter: blur(65px); right: -100px; top: -80px; pointer-events: none; }
    .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 55px; position: relative; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; border: 1px solid #3b4830; background: #1a2115; color: var(--lime); padding: 7px 12px; border-radius: 99px; text-transform: uppercase; letter-spacing: .11em; font-size: .69rem; font-weight: 800; }
    .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); }
    h1 { margin: 22px 0 19px; font-size: clamp(2.75rem, 5.6vw, 5.1rem); letter-spacing: -.075em; line-height: .99; max-width: 690px; }
    h1 .accent { color: var(--lime); }
    .hero-copy { color: #aeb7a5; font-size: 1.1rem; max-width: 540px; line-height: 1.75; margin: 0 0 28px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .btn-primary, .btn-secondary { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px; border-radius: 13px; font-weight: 750; font-size: .94rem; transition: .2s ease; }
    .btn-primary { background: var(--lime); color: #151a10; border: 1px solid var(--lime); }
    .btn-primary:hover { background: #d8ff9a; transform: translateY(-2px); }
    .btn-secondary { border: 1px solid #3b4336; background: #191d17; color: #e4eadd; }
    .btn-secondary:hover { border-color: #879276; transform: translateY(-2px); }
    .hero-note { display: flex; gap: 9px; align-items: center; color: #929b8a; font-size: .8rem; margin-top: 20px; }
    .hero-note svg { flex: 0 0 auto; color: var(--lime); }
    .visual { min-height: 360px; border: 1px solid #30392a; border-radius: 28px; background: linear-gradient(145deg, #1b2117, #151914 75%); padding: 25px; position: relative; overflow: hidden; box-shadow: 0 26px 80px #0003; }
    .visual::after { content: ""; position: absolute; width: 310px; height: 310px; border: 1px solid #c5f46719; border-radius: 50%; right: -100px; bottom: -155px; box-shadow: 0 0 0 35px #c5f46708, 0 0 0 75px #c5f46705; }
    .visual-head { display:flex; justify-content: space-between; align-items:center; color: #96a08e; text-transform: uppercase; letter-spacing: .1em; font-size: .68rem; font-weight: 800; }
    .live-pill { display: inline-flex; gap: 6px; align-items: center; color: var(--lime); border: 1px solid #3e4a2e; background: #242e1b; padding: 5px 8px; border-radius: 99px; letter-spacing: 0; text-transform: none; font-size: .7rem; }
    .live-pill::before { content:""; width: 5px; height: 5px; border-radius: 50%; background: var(--lime); }
    .visual-title { font-size: 1.5rem; font-weight: 780; letter-spacing: -.04em; margin: 25px 0 5px; }
    .visual-sub { color: #8e9886; font-size: .84rem; margin: 0 0 20px; }
    .mini-apps { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 1; }
    .mini-app { display:flex; align-items:center; gap: 11px; padding: 12px; border: 1px solid #30382b; border-radius: 15px; background: #1c2119db; }
    .mini-icon { height: 39px; width: 39px; border-radius: 12px; display:grid; place-items:center; flex-shrink:0; font-weight: 850; font-size: .78rem; color: #11170b; }
    .mini-app strong { display:block; font-size: .85rem; letter-spacing: -.02em; }
    .mini-app small { display:block; color: #8f9987; font-size: .72rem; margin-top: 2px; }
    .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border: 1px solid var(--line); background: var(--line); border-radius: 17px; overflow: hidden; margin: 8px 0 0; }

    /* La portada se muestra primero. Catálogo y noticias son vistas separadas. */

    body.about-visible #sugerir,

    .search { width:100%; height:46px; padding: 0 40px 0 43px; background: #171b16; color: var(--text); border:1px solid #30372b; border-radius:13px; outline:none; }

    .clear-search { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:transparent; color:#9ba48f; border:0; padding:5px 7px; cursor:pointer; border-radius:6px; display:none; }
    .clear-search.visible { display:block; }
    .sort-select { height:46px; padding:0 36px 0 13px; background:#171b16; color:#cbd3c3; border:1px solid #30372b; border-radius:13px; cursor:pointer; }

    .filter:hover { border-color:#65724e; color:#eaf0e3; }
    .filter.active { background:var(--lime); border-color:var(--lime); color:#151a10; font-weight:800; }
    /* Masonry compacto: cada tarjeta ocupa su altura real y los huecos se rellenan. */
    .app-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); grid-auto-rows:8px; grid-auto-flow:dense; column-gap:15px; row-gap:15px; align-items:start; }
    .app-card { border:1px solid #2b3227; border-radius:19px; background:var(--panel); padding:15px; display:flex; flex-direction:column; min-height:0; height:auto; align-self:start; position:relative; transition: transform .2s, border-color .2s, background .2s; }

    .empty-state { display:none; border:1px dashed #3a4531; border-radius:20px; padding:44px 20px; text-align:center; color:#9ca691; }

    /* Noticias con el mismo lenguaje visual de las tarjetas de apps. */

    .news-card-bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:14px; margin-top:17px; border-top:1px solid #2b3227; }

    .news-read-toggle { display:inline-flex; align-items:center; gap:5px; border:0; padding:0; background:transparent; color:#d1d9ca; font:inherit; font-size:.76rem; font-weight:750; cursor:pointer; white-space:nowrap; }

    .news-copy p { margin:0 0 17px; }

    .news-callout { margin:24px 0; padding:17px 19px; border:1px solid #37432d; border-radius:15px; background:#1a2116; color:#c6d0bc; }

    .news-sources { display:flex; flex-wrap:wrap; gap:10px; padding-top:19px; margin-top:23px; border-top:1px solid #2b3227; }
    .news-source-link { display:inline-flex; align-items:center; gap:7px; padding:9px 12px; border:1px solid #384332; border-radius:10px; color:#d4ddcc; font-size:.8rem; font-weight:700; }

    .news-check-card { border:1px solid #30392a; border-radius:14px; padding:16px; background:#191e17; }

    .news-check-card li { margin:5px 0; }
    .spec-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:20px 0 24px; }
    .spec-item { border:1px solid #30392a; border-radius:12px; padding:13px 15px; background:#191e17; }
    .spec-item dt { margin-bottom:5px; color:var(--lime); font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.07em; }
    .spec-item dd { margin:0; color:#d2dacb; font-size:.85rem; line-height:1.6; }
    .news-small-note { color:#85907d; font-size:.78rem; line-height:1.65; }
    .principles { padding: 0 0 85px; }
    .principle-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:26px; }
    .principle { padding:23px; background:#151914; border:1px solid #2a3225; border-radius:18px; }
    .principle-icon { height:38px; width:38px; display:grid; place-items:center; background:#252e1d; color:var(--lime); border-radius:12px; margin-bottom:17px; }

    .submit-banner { padding:34px; border:1px solid #435331; border-radius:24px; background:radial-gradient(ellipse at 93% 0%, #c5f46718, transparent 38%), #1a2015; display:flex; justify-content:space-between; align-items:center; gap:24px; margin-bottom:74px; }
    .submit-banner h2 { font-size:clamp(1.5rem, 3vw, 2.1rem); }
    .submit-banner p { color:#a4af98; margin:9px 0 0; font-size:.9rem; }
    .community-meta { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:15px; }
    .forum-status { display:inline-flex; align-items:center; gap:8px; border:1px solid #435b2f; background:#1b2717; color:#d6f6ad; border-radius:999px; padding:7px 11px; font-size:.76rem; font-weight:750; }
    .forum-status::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 10px #c5f46788; }
    .community-count { color:#899481; font-size:.76rem; }
    footer { border-top:1px solid #283026; padding:25px 0; color:#8b9582; font-size:.79rem; }
    .footer-inner { display:flex; justify-content:space-between; align-items:center; gap:20px; }

    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width: 900px) { .hero-grid { grid-template-columns:1fr; gap:34px; } .visual { min-height:0; } .app-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .hero { padding-top:64px; } }
    @media (max-width: 620px) { .container { width:min(100% - 30px, var(--max)); } .topbar { height:66px; } .nav-links { gap:14px; } .nav-links a:not(.nav-cta):not([href="#noticias"]):not([href="#paginas"]):not([href="#nosotros"]) { display:none; } .nav-cta { padding:9px 11px; font-size:.8rem; } .hero { padding:53px 0 35px; } h1 { font-size:clamp(2.6rem, 13vw, 4.3rem); } .hero-copy { font-size:1rem; } .visual { padding:19px; border-radius:22px; } .mini-apps { gap:8px; } .mini-app { padding:9px; gap:8px; } .mini-icon { width:33px; height:33px; border-radius:10px; } .mini-app strong { font-size:.77rem; } .mini-app small { font-size:.66rem; } .stat { padding:14px 10px; } .stat strong { font-size:1.2rem; } .stat span { font-size:.68rem; } .catalog { padding:46px 0 62px; } .section-top { align-items:start; flex-direction:column; gap:12px; } .toolbar { align-items:stretch; } .search-wrap { max-width:none; flex-basis:100%; } .sort-select { flex:1; } .app-grid { grid-template-columns:1fr; column-gap:0; row-gap:11px; } .app-photo { height:190px; }  .news-grid { grid-template-columns:1fr; } .news-feature.expanded .news-intro { grid-template-columns:1fr; padding:20px; gap:18px; } .news-feature.expanded .news-copy { padding:20px 20px 25px; } .news-feature.expanded .news-card-bottom { margin:0 20px; } .news-check-grid, .spec-grid { grid-template-columns:1fr; } .principles { padding-bottom:56px; } .principle-grid { grid-template-columns:1fr; } .submit-banner { padding:23px; flex-direction:column; align-items:flex-start; margin-bottom:50px; } .footer-inner { align-items:flex-start; flex-direction:column; } .footer-links { flex-wrap:wrap; } }
    /* Tema azul eléctrico + microinteracciones */
    :root {
      color-scheme: dark;
      --bg: #070c16;
      --panel: #0d1627;
      --panel-2: #122039;
      --line: #203858;
      --text: #f1f7ff;
      --muted: #9db1ce;
      --lime: #1685ff;
      --lime-dark: #0067f5;
      --blue-electric: #1685ff;
      --blue-bright: #35a0ff;
      --blue-deep: #06172d;
      --radius: 22px;
    }
    html { background: var(--bg); }
    body {
      background: radial-gradient(ellipse at 80% -15%, #0875ff20, transparent 43%),
                  radial-gradient(ellipse at -15% 60%, #0059d90b, transparent 38%), var(--bg);
      color: var(--text);
    }
    ::selection { background: #1685ff66; color: #fff; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid #39a4ff; outline-offset: 4px; box-shadow: 0 0 0 5px #1685ff24;
    }
    .topbar { border-bottom-color: #29466b88; background: #07101de8; backdrop-filter: blur(16px); }
    .brand-mark { color: #041326; background: linear-gradient(145deg, #54b5ff, #0875ff 68%); box-shadow: 0 0 28px #1685ff44; animation: bluePulse 4.5s ease-in-out infinite; }
    .brand span em { color: var(--blue-bright); }
    .nav-links { color: #9eb4d2; }
    .nav-links a { transition: color .22s ease, transform .22s ease, background .22s ease; }
    .nav-links a:not(.nav-cta):not(.nav-news) { position: relative; }
    .nav-links a:not(.nav-cta):not(.nav-news)::after { content: ""; position: absolute; left: 0; right: 100%; bottom: -6px; height: 2px; border-radius: 2px; background: var(--blue-bright); transition: right .24s ease; }
    .nav-links a:not(.nav-cta):not(.nav-news):hover::after { right: 0; }
    .nav-links a.nav-news { border-color: #167ee5; background: linear-gradient(135deg, #102b4c, #0b1a30); color: #63baff; box-shadow: inset 0 1px 0 #ffffff12, 0 0 0 1px #1685ff1f, 0 5px 22px #0067f51a; }
    .nav-links a.nav-news::before { background: #35a0ff; box-shadow: 0 0 11px #1685ffcc; animation: bluePulse 2s ease-in-out infinite; }
    .nav-links a.nav-news:hover, body.news-visible .nav-links a.nav-news { color: #03152c; background: linear-gradient(135deg, #5ebaff, #1685ff); border-color: #58b7ff; box-shadow: 0 0 28px #1685ff55; transform: translateY(-2px); }
    body.news-visible .nav-links a.nav-news::before { background: #03152c; box-shadow: none; }
    .nav-cta, .btn-primary { background: linear-gradient(135deg, #54b4ff, #0875ff 75%); color: #041326; border-color: #248fff; box-shadow: 0 7px 25px #0067f52b; }
    .nav-cta:hover, .btn-primary:hover { color: #031329; background: linear-gradient(135deg, #85cbff, #238dff); box-shadow: 0 10px 30px #1685ff54; transform: translateY(-3px); }
    .hero { isolation: isolate; }
    .hero::before { background: #1685ff24; filter: blur(78px); animation: orbDrift 11s ease-in-out infinite alternate; }
    .eyebrow { border-color: #1b5790; background: #0d2541; color: #62baff; box-shadow: inset 0 1px 0 #ffffff0a; }
    .eyebrow-dot { background: #37a4ff; box-shadow: 0 0 14px #1685ff; animation: bluePulse 2.4s ease-in-out infinite; }
    h1 .accent, .section-kicker { color: var(--blue-bright); }
    .hero-copy { color: #a6bad4; }
    .btn-secondary { border-color: #2d4768; background: #0e1a2d; color: #dceaff; }
    .btn-secondary:hover { border-color: #258eff; background: #122746; box-shadow: 0 8px 24px #0067f526; }
    .hero-note { color: #8fa8c8; }
    .hero-note svg { color: #43acff; }
    .visual { border-color: #214773; background: linear-gradient(145deg, #122644, #0a1424 75%); box-shadow: 0 26px 80px #0006, 0 0 40px #0067f50b; animation: floatPanel 7s ease-in-out infinite; }
    .visual::after { border-color: #1685ff35; box-shadow: 0 0 0 35px #1685ff12, 0 0 0 75px #1685ff08; }
    .visual-head, .visual-sub { color: #91a9c9; }
    .live-pill { color: #64bdff; border-color: #1e5a91; background: #102d4f; }
    .live-pill::before { background: #36a5ff; box-shadow: 0 0 10px #1685ff; animation: bluePulse 1.8s infinite; }
    .mini-app { border-color: #254365; background: #0e1c30e8; transition: transform .24s ease, border-color .24s ease, background .24s ease, box-shadow .24s ease; }
    .mini-app:hover { transform: translateY(-4px); border-color: #1685ff; background: #122747; box-shadow: 0 10px 25px #0003, 0 0 18px #1685ff12; }
    .mini-app:nth-child(1) { animation: riseIn .55s .08s both; }
    .mini-app:nth-child(2) { animation: riseIn .55s .16s both; }
    .mini-app:nth-child(3) { animation: riseIn .55s .24s both; }
    .mini-app:nth-child(4) { animation: riseIn .55s .32s both; }
    .mini-app small { color: #8fa8c7; }
    .stats { border-color: #203858; background: #203858; }
    .stat { background: #0b1525; transition: background .22s ease; }
    .stat:hover { background: #10233d; }
    .stat span { color: #9ab0cd; }
    .search { background: #0c1728; border-color: #254061; }
    .search-wrap svg { color: #77a4d5; }
    .search:focus { border-color: #1685ff; box-shadow: 0 0 0 4px #1685ff21; }
    .search::placeholder { color: #748eaf; }
    .sort-select { background: #0c1728; color: #d7e8ff; border-color: #254061; }
    .filter { border-color: #254061; background: #0c1728; color: #a5bad6; transition: transform .2s ease, border-color .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease; }
    .filter:hover { border-color: #258fff; color: #e9f5ff; transform: translateY(-2px); }
    .filter.active { background: linear-gradient(135deg, #59baff, #1685ff); border-color: #4db3ff; color: #03142a; box-shadow: 0 5px 18px #1685ff30; }
    .result-count { color: #95add0; }
    .app-card { border-color: #203858; background: linear-gradient(145deg, #0f1a2c, #0b1422); box-shadow: 0 6px 22px #0002; animation: cardEnter .55s both; transition: transform .28s cubic-bezier(.2,.75,.25,1), border-color .25s ease, background .25s ease, box-shadow .25s ease; }
    .app-card:nth-child(8n+1) { animation-delay: .025s; }
    .app-card:nth-child(8n+2) { animation-delay: .06s; }
    .app-card:nth-child(8n+3) { animation-delay: .095s; }
    .app-card:nth-child(8n+4) { animation-delay: .13s; }
    .app-card:nth-child(8n+5) { animation-delay: .165s; }

    /* Botón flotante para volver al principio de la página. */
    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 90;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid #25282e;
      border-radius: 16px;
      background: linear-gradient(145deg, #353941, #111318);
      color: #fff;
      box-shadow: 0 8px 24px #11131826;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(12px) scale(.96);
      transition: opacity .22s ease, transform .22s ease, visibility .22s ease, box-shadow .22s ease, background .22s ease;
    }
    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .back-to-top:hover {
      background: linear-gradient(145deg, #4a4e57, #25282e);
      box-shadow: 0 12px 30px #11131830;
      transform: translateY(-3px);
    }
    .back-to-top:active { transform: translateY(0) scale(.95); }
    .back-to-top svg { width: 21px; height: 21px; }
    @media (max-width: 620px) {
      .back-to-top { width: 45px; height: 45px; right: 16px; bottom: 16px; border-radius: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .back-to-top { transition: none; }
    }


    /* Presentación breve de marca al entrar al catálogo de aplicaciones. */
    .catalog-intro {

      padding: 24px; background: rgba(246,247,249,.97); backdrop-filter: blur(18px);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .32s ease, visibility .32s ease;
    }
    .catalog-intro[hidden] { display: none !important; }
    .catalog-intro.visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .catalog-intro.leaving { opacity: 0; visibility: hidden; }
    .catalog-intro-card { display: flex; flex-direction: column; align-items: center; gap: 15px; text-align: center; animation: introBrandIn .45s cubic-bezier(.2,.75,.25,1) both; }

    /* Cursor personalizado: círculo negro semitransparente para mouse/trackpad. */
    .apps-libres-cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .42);
      border: 1px solid rgba(255, 255, 255, .58);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .16);
      pointer-events: none;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -50%) scale(.7);
      transition: opacity .14s ease, transform .14s ease, width .16s ease, height .16s ease, background .16s ease, border-color .16s ease;
      will-change: left, top, transform;
    }
    .apps-libres-cursor.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    .apps-libres-cursor.is-over-link {
      width: 34px;
      height: 34px;
      background: rgba(0, 0, 0, .28);
      border-color: rgba(0, 0, 0, .2);
      box-shadow: 0 0 0 5px rgba(0, 0, 0, .075);
    }
    .apps-libres-cursor.is-pressed {
      transform: translate(-50%, -50%) scale(.82);

    }

      .apps-libres-cursor { transition: none; }
